name: Robot Framework Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Robot Framework et Browser Library
        run: |
          pip install -r requirements.txt
          rfbrowser init --skip-browsers

      - name: Lancer les tests (Chrome du runner, sans fenêtre)
        run: robot --outputdir results -v HEADLESS:True saucedemo.robot

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-robot
          path: results/
